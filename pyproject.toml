[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-voice-harness"
version = "0.1.0"
description = "Local Linux voice assistant with Herdr-managed Cursor agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
wake = [
  "numpy==2.4.6",
  "openwakeword==0.6.0",
  "webrtcvad-wheels==2.0.14",
]
dictation = [
  "onnx-asr[hub]>=0.7.0",
  "onnxruntime>=1.20",
]
dictation-cuda = [
  "onnx-asr[gpu,hub]>=0.7.0",
]
dictation-whisper = [
  "faster-whisper>=1.2.1",
]
tts = [
  "chatterbox-tts==0.1.7",
  "soundfile==0.14.0",
]

[project.scripts]
voice-harness = "local_voice_harness.cli:main"
voice-harness-wake = "local_voice_harness.wake.daemon:main"
voice-harness-dictation = "local_voice_harness.stt.launcher:main"
voice-harness-llm = "local_voice_harness.llm_launcher:main"
voice-harness-tts = "local_voice_harness.tts.server:main"
voice-harness-cursor-worker = "local_voice_harness.cursor.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_voice_harness"]

[tool.uv]
override-dependencies = [
  "torch==2.10.0",
  "torchaudio==2.10.0",
]
conflicts = [
  [
    { extra = "dictation" },
    { extra = "dictation-cuda" },
  ],
  [
    { extra = "dictation" },
    { extra = "tts" },
  ],
  [
    { extra = "dictation-cuda" },
    { extra = "tts" },
  ],
  [
    { extra = "wake" },
    { extra = "tts" },
  ],
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=local_voice_harness",
  "--cov-branch",
  "--cov-fail-under=40",
  "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["local_voice_harness"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.voice-harness.coverage.module-minimums]
"src/local_voice_harness/cursor/provisioning.py" = 70
"src/local_voice_harness/cursor/service.py" = 70
"src/local_voice_harness/integrations/github.py" = 65
"src/local_voice_harness/integrations/herdr/client.py" = 50
"src/local_voice_harness/integrations/herdr/repository.py" = 45
"src/local_voice_harness/integrations/herdr/session.py" = 50
"src/local_voice_harness/integrations/herdr/workspace.py" = 50
"src/local_voice_harness/local_git.py" = 90
"src/local_voice_harness/llm_transport.py" = 85
"src/local_voice_harness/llm.py" = 85
"src/local_voice_harness/service_manager.py" = 35
"src/local_voice_harness/tts/client.py" = 75
"src/local_voice_harness/wake/daemon.py" = 60
